DISTRO_ARCH ?= "arm64"

KERNEL_NAME ?= "mainline-imx8mmlpd4-evk"

U_BOOT_CONFIG:imx8mmlpd4-evk = "imx8mm_evk_defconfig"
U_BOOT_BIN:imx8mmlpd4-evk = "flash.bin"

IMAGE_FSTYPES ?= "wic"
WKS_FILE ?= "imx8mmlpd4-evk.wks.in"
IMAGER_INSTALL:wic += "u-boot-imx8mmlpd4-evk"
IMAGER_BUILD_DEPS += "u-boot-imx8mmlpd4-evk"

IMAGE_INSTALL += "u-boot-tools libubootenv-tool u-boot-script"

# Keep the board DTB explicit for boot flows that consume DTB_FILES.
DTB_FILES = "freescale/imx8mm-evk.dtb"